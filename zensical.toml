[project]
site_name = "Northline"
site_url = "https://noproductab.github.io/cursor-test/"
site_description = "A quiet place to start — built with Zensical and published on GitHub Pages."
site_author = "Northline"
copyright = "Copyright &copy; 2026 Northline"
repo_url = "https://github.com/noproductab/cursor-test"
repo_name = "cursor-test"

nav = [
  { "Home" = "index.md" },
  { "About" = "about.md" },
  { "Guide" = "guide.md" },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/home.js"]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.code.copy",
  "content.tooltips",
]

[project.theme.font]
text = "Figtree"
code = "IBM Plex Mono"

[project.theme.icon]
logo = "lucide/compass"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/noproductab/cursor-test"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
